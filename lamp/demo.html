<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lamp demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lamp.css">
  <script>
    // Apply a saved light/dark choice before first paint so the page doesn't flash.
    try {
      const theme = localStorage.getItem("lamp.theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch { /* private mode etc. */ }
  </script>
  <style>
    /* page colors from duckweather, so the lamp looks exactly as it did there */
    :root { --bg: #f5ede1; --ink: #33261d; --ink-2: #6e5c4e; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #1d1713; --ink: #f3e8da; --ink-2: #c8b6a3; color-scheme: dark; }
    }
    :root[data-theme="dark"] { --bg: #1d1713; --ink: #f3e8da; --ink-2: #c8b6a3; color-scheme: dark; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Outfit", system-ui, sans-serif;
    }
    .room {
      position: relative; /* the lamp hangs from the top of this */
      min-height: 100vh;
      padding: 150px 16px 40px;
      text-align: center;
    }
    h1 { margin: 0; font-weight: 300; font-size: clamp(40px, 7vw, 68px); }
    p { margin: 10px 0 0; font-size: 13px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-2); }
  </style>
</head>
<body>
  <div class="room">
    <div class="lamp-glow" aria-hidden="true"></div>
    <button class="lamp" id="lamp" type="button" aria-label="Turn the light off" title="pull the string">
      <span class="lamp-cord"></span>
      <svg viewBox="0 0 44 58" aria-hidden="true">
        <rect class="socket" x="15" y="1" width="14" height="16" rx="3"/>
        <path class="twine" d="M13.5 4.5Q22 7.5 30.5 4.5M13.5 9Q22 12 30.5 9M13.5 13.5Q22 16.5 30.5 13.5"/>
        <path class="glass" d="M16 17C16 23 7 27 7 39a15 15 0 0 0 30 0c0-12-9-16-9-22z"/>
        <path class="filament" d="M18.5 18v13M25.5 18v13M18.5 31h7M18.5 31q-2.5 6 1.2 7.5 1.8-3.5-1.2-7.5M22 31q-1.8 7 0 8 1.8-1 0-8M25.5 31q2.5 6-1.2 7.5-1.8-3.5 1.2-7.5"/>
      </svg>
    </button>

    <h1>pull the string</h1>
    <p>lamp demo</p>
  </div>
  <script src="lamp.js"></script>
</body>
</html>
